# Capture each 6-hour mark, starting when the day's Bank Rate is published:
# 18:00, 00:00, 06:00, 12:00 ICT = 11:00, 17:00, 23:00, 05:00 UTC. Cron times are UTC.
# The first run is a minute after the mark (and refreshes the Bank Rates first). The second, 15
# minutes after, only acts if the first couldn't capture the mark, or held the 18:00 alert because
# that day's Bank Rate wasn't out yet.
#
# Every 15 minutes: check live deviations and alert when a pair goes over 2% or 4%, or comes
# back within 2% (README, "Deviation alerts"). Set DEVIATION_ALERTS = "off" to pause it.
[triggers]
crons = ["1 5,11,17,23 * * *", "15 5,11,17,23 * * *", "*/15 * * * *"]

# Shared cache across Cloudflare locations.
[[kv_namespaces]]
binding = "RATES_CACHE"
id = "eb8a3ed8adc343c1bbf6141a5b4ca1c2"

# Secrets (never put these in this file; add them in the Worker's
# Settings -> Variables and Secrets, or with `npx wrangler secret put NAME`):
#   GRAPH_API_KEY
#   BOT_API_TOKEN
#   VIEWER_LINKS   (link mode) one "name:token" per line
#   SUPABASE_SECRET_KEY       price history storage
#   GOOGLE_CHAT_WEBHOOK_URL   optional, alerts at each 6-hour capture
#   TELEGRAM_BOT_TOKEN        optional, Telegram alerts (from @BotFather)
#   TELEGRAM_CHAT_ID          optional, the channel or group to post to
