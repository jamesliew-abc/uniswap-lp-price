# Cloudflare Worker config for the shared version of the price deviation dashboard.
# See README.md in this folder for setup.

name = "thbt-deviation-dashboard"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Don't publish per-version preview URLs: they would sit outside the sign-in check's own URL.
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker (and its sign-in check) before serving the page, so nothing is served unchecked.
run_worker_first = true

[vars]
# These aren't secret. Set them here rather than in the Cloudflare dashboard, because each
# deploy replaces dashboard values with what's in this file.

# How viewers get in:
#   "link"   personal links, listed in the VIEWER_LINKS secret (README, option A)
#   "access" Cloudflare Access, e.g. an emailed one-time code (README, option B)
AUTH_MODE = "link"

# Only used when AUTH_MODE = "access" (README, option B).
ACCESS_TEAM_DOMAIN = ""      # e.g. "yourteam.cloudflareaccess.com"
ACCESS_AUD = ""              # Application Audience (AUD) tag
ALLOWED_EMAIL_DOMAIN = ""    # optional, e.g. "yourcompany.com"

# Shared cache across Cloudflare locations.
[[kv_namespaces]]
binding = "RATES_CACHE"
id = "eb8a3ed8adc343c1bbf6141a5b4ca1c2"

# Secrets (never put these in this file; add them in the Worker's
# Settings -> Variables and Secrets, or with `npx wrangler secret put NAME`):
#   GRAPH_API_KEY
#   BOT_API_TOKEN
#   VIEWER_LINKS   (link mode) one "name:token" per line
