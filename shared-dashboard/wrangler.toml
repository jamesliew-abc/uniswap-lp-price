# Cloudflare Worker config for the shared version of the price deviation dashboard.
# See README.md in this folder for setup.

name = "uniswap-lp-price"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Don't publish per-version preview URLs: they would sit outside the sign-in check's own URL.
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker (and its sign-in check) before serving the page, so nothing is served unchecked.
run_worker_first = true

[vars]
# These aren't secret. Set them here rather than in the Cloudflare dashboard, because each
# deploy replaces dashboard values with what's in this file.

# How viewers get in:
#   "link"   personal links, listed in the VIEWER_LINKS secret (README, option A)
#   "access" Cloudflare Access, e.g. an emailed one-time code (README, option B)
AUTH_MODE = "link"

# Only used when AUTH_MODE = "access" (README, option B).
ACCESS_TEAM_DOMAIN = ""      # e.g. "yourteam.cloudflareaccess.com"
ACCESS_AUD = ""              # Application Audience (AUD) tag
ALLOWED_EMAIL_DOMAIN = ""    # optional, e.g. "yourcompany.com"

# Price history (README, "Price history and alerts"). The URL isn't secret; the key is
# the SUPABASE_SECRET_KEY secret.
SUPABASE_URL = "https://terfvnsyvtccujglklrq.supabase.co"
# Optional: the dashboard's address, used for the "Open price history" link in alerts.
DASHBOARD_URL = ""           # e.g. "https://uniswap-lp-price.<your-subdomain>.workers.dev"
# Alerts when a pair goes over 2% / 4% or comes back within 2%, checked every 5 minutes.
DEVIATION_ALERTS = "on"      # "off" to pause

# Capture each 6-hour mark (09:00, 15:00, 21:00, 03:00 ICT = 02:00, 08:00, 14:00, 20:00 UTC).
# The first run is a minute after the mark; the second only acts if the first couldn't capture
# it (for example, the subgraph hadn't indexed up to the mark yet). Cron times are UTC.
#
# Every 5 minutes: check live deviations and alert when a pair goes over 2% or 4%, or comes
# back within 2% (README, "Deviation alerts"). Set DEVIATION_ALERTS = "off" to pause it.
[triggers]
crons = ["1 2,8,14,20 * * *", "15 2,8,14,20 * * *", "*/5 * * * *"]

# Shared cache across Cloudflare locations.
[[kv_namespaces]]
binding = "RATES_CACHE"
id = "eb8a3ed8adc343c1bbf6141a5b4ca1c2"

# Secrets (never put these in this file; add them in the Worker's
# Settings -> Variables and Secrets, or with `npx wrangler secret put NAME`):
#   GRAPH_API_KEY
#   BOT_API_TOKEN
#   VIEWER_LINKS   (link mode) one "name:token" per line
#   SUPABASE_SECRET_KEY       price history storage
#   GOOGLE_CHAT_WEBHOOK_URL   optional, alerts at each 6-hour capture
#   TELEGRAM_BOT_TOKEN        optional, Telegram alerts (from @BotFather)
#   TELEGRAM_CHAT_ID          optional, the channel or group to post to
